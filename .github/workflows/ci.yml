name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        run: pnpm commit:check
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: pnpm commit:check --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: pnpm commit:check --range "$BEFORE_SHA..$GITHUB_SHA" --allow-merge
        env:
          BEFORE_SHA: ${{ github.event.before }}

      # pnpm check 里已包含 pack:uni（easycom 目录约定、可移植导入、示例工程不引用 npm 包），
      # 所以这里不再单独跑一次。真正把生成工程装起来构建的是下面的 standalone-example job。
      - name: Check
        run: pnpm check

      - name: Build docs
        run: pnpm docs:build

      - name: Build WeChat mini program
        run: pnpm -C playground build:mp-weixin

      - name: Build Alipay mini program
        run: pnpm -C playground build:mp-alipay

  standalone-example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build DCloud publish workspace
        run: pnpm build:uni

      # 必须搬出仓库再验证：留在 artifacts/ 下时 pnpm 会向上找到根 pnpm-workspace.yaml，
      # 生成工程可能经 workspace 链接解析到 uni-tree-view，构建通过也说明不了插件形态可用。
      - name: Move the generated project out of the workspace
        run: mv artifacts/hbuilderx/KieranYin9527-tree-example "$RUNNER_TEMP/standalone-example"

      - name: Install the standalone project
        working-directory: ${{ runner.temp }}/standalone-example
        run: pnpm install --no-lockfile

      - name: Type check the standalone project
        working-directory: ${{ runner.temp }}/standalone-example
        run: pnpm lint:type

      - name: Build the standalone project for H5
        working-directory: ${{ runner.temp }}/standalone-example
        run: pnpm build:h5

  cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test