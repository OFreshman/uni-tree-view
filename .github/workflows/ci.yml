name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        run: pnpm commit:check
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: pnpm commit:check --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: pnpm commit:check --range "$BEFORE_SHA..$GITHUB_SHA" --allow-merge
        env:
          BEFORE_SHA: ${{ github.event.before }}

      - name: Check
        run: pnpm check

      - name: Build docs
        run: pnpm docs:build

      - name: Build WeChat mini program
        run: pnpm -C playground build:mp-weixin

      - name: Build Alipay mini program
        run: pnpm -C playground build:mp-alipay

      - name: Build uni_modules package
        run: pnpm pack:uni

  cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test