name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.0.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and workspace versions
        id: release-info
        run: pnpm release:check "$RELEASE_TAG"

      - name: Extract release notes
        run: pnpm changelog:notes "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Check
        run: pnpm check

      - name: Build mini programs
        run: pnpm check:platforms

      - name: Check final component size
        run: pnpm check:size

      - name: Build and validate docs
        run: pnpm docs:build

      # pnpm check 已生成并校验 npm tarball（npm 打包得到的 .tgz 压缩包）及 DCloud 工程。
      # 发布和 GitHub release 上传使用同一份已校验的压缩包，不再重新打包。

      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          published=$(npm view "uni-tree-view@${version}" version 2>/dev/null || true)
          if [[ "$published" == "$version" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "uni-tree-view@${version} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          PACKAGE_TARBALL: ${{ steps.release-info.outputs.artifact }}
          NPM_DIST_TAG: ${{ steps.release-info.outputs.npm_tag }}

      - name: Create or update GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_TARBALL" --clobber
            gh release edit "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "$RELEASE_TAG" \
              --prerelease="$IS_PRERELEASE"
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_TARBALL" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "$RELEASE_TAG" \
              --verify-tag \
              --prerelease="$IS_PRERELEASE"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.release-info.outputs.artifact }}
          IS_PRERELEASE: ${{ steps.release-info.outputs.prerelease }}