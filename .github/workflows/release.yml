name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: node -e "const expected = `v${require('./packages/core/package.json').version}`; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`)"

      - name: Check
        run: pnpm check

      - name: Build release artifacts
        run: pnpm pack:npm && pnpm pack:uni

      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          published=$(npm view "uni-tree-view@${version}" version 2>/dev/null || true)
          if [[ "$published" == "$version" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "uni-tree-view@${version} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.npm-version.outputs.published != 'true'
        run: pnpm --filter './packages/core' publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create or update GitHub release
        shell: bash
        run: |
          assets=(artifacts/npm/* artifacts/dcloud/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}