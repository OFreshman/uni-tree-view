name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.0.9
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag must start with v, received $RELEASE_TAG"
            exit 1
          fi
          version="$(node -p 'require("./packages/core/package.json").version')"
          expected="v${version}"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "::error::Expected tag $expected, received $RELEASE_TAG"
            exit 1
          fi

      - name: Check
        run: pnpm check

      - name: Build WeChat mini program
        run: pnpm -C playground build:mp-weixin

      - name: Build Alipay mini program
        run: pnpm -C playground build:mp-alipay

      - name: Build release artifacts
        run: pnpm pack:npm && pnpm pack:uni

      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          published=$(npm view "uni-tree-view@${version}" version 2>/dev/null || true)
          if [[ "$published" == "$version" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "uni-tree-view@${version} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.npm-version.outputs.published != 'true'
        working-directory: packages/core
        run: npm publish --access public --provenance

      - name: Create or update GitHub release
        shell: bash
        run: |
          assets=(artifacts/npm/* artifacts/dcloud/*)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}