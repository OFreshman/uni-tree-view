<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">uni-tree-view social card</title>
  <desc id="desc">uni-tree-view, a cross-platform tree view component for uni-app and Vue 3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FFFB" />
      <stop offset="0.62" stop-color="#ECFFFA" />
      <stop offset="1" stop-color="#E6F8FF" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1020 30) rotate(135) scale(520 420)" gradientUnits="userSpaceOnUse">
